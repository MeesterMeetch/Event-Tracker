# Render Blueprint — Event Tracker
#
# Defines three resources:
#   1. Managed Postgres database
#   2. Node web service for the API (Express + background jobs)
#   3. Static site for the Vite frontend (proxies /api to the API service)
#
# Reference: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. API — Express web service
  # ---------------------------------------------------------------------------
  - type: web
    name: ev-tracker-api
    runtime: node
    region: oregon
    plan: starter        # always-on, so the background jobs (grading, CLV) keep running
    branch: main

    # Activates the pnpm pinned in package.json rather than whatever the build
    # image happens to ship. The overrides in pnpm-workspace.yaml are only read
    # by pnpm 10; under pnpm 9 they are silently ignored, which would resolve a
    # different dependency tree here than the one that was tested. The npm
    # fallback covers an image without corepack, so a missing corepack degrades
    # to the right version rather than failing the deploy.
    buildCommand: (corepack enable pnpm || npm i -g pnpm@10.34.5); pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @workspace/api-server run build
    # Creates/updates the database tables before the server starts.
    # Runs drizzle-kit directly (not via "pnpm run") to avoid pnpm's pre-run
    # dependency check, which kept re-triggering a failing frozen install.
    preDeployCommand: cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ev-tracker-db
          property: connectionString
      # The Odds API key — powers odds data, grading, and CLV capture.
      # Paste your value in the Render dashboard when prompted.
      - key: ODDS_API_KEY
        sync: false
      # Bookmaker regions for bulk game-line scans.
      #
      # This must be set explicitly. lineRegions() falls back to "us" when the
      # variable is missing, and that fallback is silent, so an unset value
      # looks identical to a working config while quietly dropping Pinnacle —
      # the only genuine sharp anchor reachable through this feed, and an
      # EU-region book. Without it, sharpProbPercent is null on every edge and
      # the fair price is a consensus of US soft books averaging each other.
      #
      # Cost: three markets (h2h, spreads, totals) per slate scan, doubled by
      # the second region. Three credits becomes six. See odds-regions.ts.
      - key: ODDS_REGIONS_LINES
        value: us,eu
      # ODDS_REGIONS_PROPS is intentionally NOT set to us,eu. Props bill per
      # market per event, so an eleven-market request across a sixteen-game
      # slate is 176 credits in one region and 352 in two. Leave it on the "us"
      # default until the credit burn justifies otherwise.
      # Uncomment these two only if you use the AI features:
      # - key: AI_INTEGRATIONS_OPENAI_API_KEY
      #   sync: false
      # - key: AI_INTEGRATIONS_OPENAI_BASE_URL
      #   value: https://api.openai.com/v1

  # ---------------------------------------------------------------------------
  # 2. Frontend — Vite static site (no "region" — Render doesn't allow it here)
  # ---------------------------------------------------------------------------
  - type: web
    name: ev-tracker-web
    runtime: static
    branch: main

    buildCommand: (corepack enable pnpm || npm i -g pnpm@10.34.5); pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @workspace/ev-tracker run build
    staticPublishPath: artifacts/ev-tracker/dist/public

    routes:
      # Forward API calls to the API service so the browser stays same-origin.
      # After first deploy, confirm the API's real URL and update this host if it differs.
      - type: rewrite
        source: /api/*
        destination: https://ev-tracker-api-sdly.onrender.com/api/*
      # SPA fallback — everything else serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      # Disable automatic dependency installation so our buildCommand handles it
      - key: SKIP_INSTALL_DEPS
        value: "true"

  # ---------------------------------------------------------------------------
  # 3. Database — managed Postgres
  # ---------------------------------------------------------------------------
databases:
  - name: ev-tracker-db
    region: oregon
    plan: basic-256mb           # paid, always-on, does not expire
    databaseName: ev_tracker
    user: ev_tracker
